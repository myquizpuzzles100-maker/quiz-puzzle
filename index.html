<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧠 Quiz Puzzle</h1>
        <p>Test your brain and have fun!</p>
    </header>

    <!-- HOME -->
    <section id="home" class="screen">
        <h2>Welcome! 🎉</h2>
        <p>Choose a game:</p>

        <button onclick="startQuiz()">🎯 Start Quiz</button>
        <button onclick="startPuzzle()">🧩 Start Puzzle</button>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="screen hidden">

        <div class="top">
            <span id="questionNumber"></span>
            <span>⏱️ <span id="timer">15</span></span>
        </div>

        <h2 id="question"></h2>

        <div id="answers"></div>

        <p id="quizMessage"></p>

        <button id="nextButton" onclick="nextQuestion()">
            Next ➜
        </button>

    </section>

    <!-- PUZZLE -->
    <section id="puzzle" class="screen hidden">

        <h2>🧩 Word Puzzle</h2>

        <p>Unscramble this word:</p>

        <h1 id="scrambledWord"></h1>

        <input type="text" id="puzzleAnswer"
               placeholder="Type your answer">

        <button onclick="checkPuzzle()">Check Answer</button>

        <p id="puzzleMessage"></p>

        <button onclick="newPuzzle()">New Puzzle 🔄</button>

        <button onclick="goHome()">Home 🏠</button>

    </section>

    <!-- RESULT -->
    <section id="result" class="screen hidden">

        <h2>🎉 Quiz Finished!</h2>

        <h1 id="finalScore"></h1>

        <p>Great job! 💜</p>

        <button onclick="startQuiz()">Play Again 🔄</button>
        <button onclick="goHome()">Home 🏠</button>

    </section>

    <script src="script.js"></script>

</body>
</html>
